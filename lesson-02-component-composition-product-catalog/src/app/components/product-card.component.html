<article
  class="card"
  [class.card--selected]="selected()"
  (click)="requestView()"
>
  <div class="card-topline">
    <span class="category-chip">{{ product().category }}</span>

    @if (product().featured) {
      <span class="featured-chip">Featured</span>
    }
  </div>

  <div class="card-copy">
    <h3>{{ product().name }}</h3>
    <p>{{ product().description }}</p>
  </div>

  <div class="card-meta">
    <strong>{{
      product().price | currency: "USD" : "symbol" : "1.0-0"
    }}</strong>
    <span>{{ product().inventory }} units in stock</span>
  </div>

  <button
    type="button"
    class="shortlist-button"
    [class.shortlist-button--active]="product().shortlisted"
    (click)="toggleShortlist($event)"
  >
    {{ product().shortlisted ? "Remove from shortlist" : "Add to shortlist" }}
  </button>
</article>
